<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello from Queencess</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 3rem 1.5rem;
      background: linear-gradient(135deg, #f8e1f4, #e6e6fa 60%, #dcd6f7);
      font-family: Georgia, 'Times New Roman', serif;
      color: #3a2e4f;
    }

    .hero {
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: normal;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      margin: 0 0 0.25rem;
      color: #5b4b78;
    }

    .name {
      font-family: 'Brush Script MT', 'Segoe Script', 'Lucida Handwriting', cursive;
      font-size: clamp(3rem, 12vw, 6rem);
      color: #8e44ad;
      margin: 0;
    }

    .card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(94, 60, 130, 0.15);
      padding: 2rem 2.5rem;
      max-width: 420px;
      text-align: center;
    }

    .card p {
      margin: 0;
      font-size: 1.15rem;
      font-style: italic;
      color: #5b4b78;
      line-height: 1.5;
    }

    .card p::before {
      content: "\201C";
    }

    .card p::after {
      content: "\201D";
    }

    .card button {
      margin-top: 1.25rem;
      padding: 0.6rem 1.5rem;
      font-family: inherit;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      color: #fff;
      background: #8e44ad;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .card button:hover {
      background: #7a3898;
      transform: translateY(-1px);
    }

    .card button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Hello</h1>
    <p class="name">Queencess</p>
  </div>

  <div class="card">
    <p id="quote">Suffer now to enjoy later</p>
    <button type="button" onclick="nextQuote()">New Affirmation</button>
  </div>

  <script>
    const quotes = [
      "Suffer now to enjoy later",
      "Grace is built in the quiet hours",
      "Every setback is a setup for a comeback",
      "Discipline today, freedom tomorrow",
      "Your patience is planting seeds you haven't seen yet",
      "Bloom on your own time"
    ];

    let quoteIndex = 0;

    fuction nextQuote() {
      quoteIndex = (quoteIndex + 1) % quotes.length;
      document.getElementById("quote").textContent = quotes[quoteIndex];
    }
  </script>
</body>
</html>
